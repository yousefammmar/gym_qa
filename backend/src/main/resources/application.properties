# Gym Tracker settings. Everything runs on this machine: http://localhost:8080
# Start it from the backend/ folder:  ./mvnw spring-boot:run
server.port=8080

# The website (HTML, CSS, JS) lives in ../frontend and is served from there,
# so edits to the frontend show up after a browser refresh, no restart needed.
spring.web.resources.static-locations=file:../frontend/

# SQLite database file: backend/data/gym-tracker.db (relative to the backend/ folder).
# GymTrackerApplication creates ./data before Spring starts (SQLite cannot create folders).
spring.datasource.url=jdbc:sqlite:data/gym-tracker.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# One connection: SQLite allows a single writer, so this avoids "database is locked" errors.
spring.datasource.hikari.maximum-pool-size=1
# SQLite ignores foreign keys unless this is switched on for every connection.
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON

# Run db/schema.sql on every start. It only uses CREATE TABLE IF NOT EXISTS / INSERT OR IGNORE,
# so existing data is kept.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql

# Reject 5.5 reps instead of silently turning it into 5.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.default-property-inclusion=non_null
